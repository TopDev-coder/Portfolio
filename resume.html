<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Résumé</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root { --text: #0f172a; --muted: #4b5563; --line: #e5e7eb; --primary: #4f46e5; --bg: #f3f4f6; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 10.5pt/1.5 "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    .toolbar { max-width: 8.5in; margin: 20px auto 0; padding: 0 16px; display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .toolbar a, .toolbar button { font: 600 14px "Inter", sans-serif; padding: 9px 16px; border-radius: 999px; border: 1px solid #d1d5db; background: #fff; color: var(--text); text-decoration: none; cursor: pointer; }
    .toolbar .primary { background: var(--primary); color: #fff; border-color: var(--primary); }
    .page { max-width: 8.5in; margin: 16px auto 40px; background: #fff; padding: 0.55in 0.6in; box-shadow: 0 10px 40px rgba(0,0,0,0.08); }
    header { display: flex; justify-content: space-between; gap: 24px; padding-bottom: 14px; border-bottom: 2px solid var(--text); }
    h1 { margin: 0; font-size: 24pt; letter-spacing: -0.02em; line-height: 1.1; }
    .tagline { margin: 2px 0 0; color: var(--muted); font-size: 10pt; }
    .role { margin: 4px 0 0; font-size: 12pt; font-weight: 600; color: var(--primary); }
    .contact { text-align: right; white-space: nowrap; font-size: 9.5pt; color: var(--muted); line-height: 1.6; }
    .contact a { color: inherit; text-decoration: none; }
    h2 { font-size: 9pt; text-transform: uppercase; letter-spacing: 0.12em; color: var(--primary); margin: 18px 0 8px; }
    p { margin: 0 0 6px; }
    .summary { color: #1f2937; }
    .job { margin-bottom: 12px; break-inside: avoid; }
    .job__head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .job__head strong { font-size: 11pt; }
    .job__head span { color: var(--muted); font-size: 9.5pt; white-space: nowrap; }
    .job__co { color: var(--muted); font-weight: 600; font-size: 9.5pt; margin-bottom: 4px; }
    ul { margin: 4px 0 0; padding-left: 16px; }
    li { margin-bottom: 2px; }
    .stack { color: var(--muted); font-size: 9pt; margin-top: 4px; }
    .two { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 28px; }
    .skills div { margin-bottom: 4px; }
    .skills b { font-weight: 600; }
    .proj { break-inside: avoid; margin-bottom: 8px; }
    .proj b { font-weight: 600; }
    .edu div { display: flex; justify-content: space-between; gap: 12px; }
    .edu span { color: var(--muted); }
    @media (max-width: 640px) {
      .page { padding: 24px 16px; }
      header { flex-direction: column; }
      .contact { text-align: left; white-space: normal; }
      .two { grid-template-columns: 1fr; }
    }
    @page { size: letter; margin: 0.45in 0.5in; }
    @media print {
      body { background: #fff; font-size: 10pt; }
      .toolbar { display: none; }
      .page { box-shadow: none; margin: 0; padding: 0; max-width: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <a href="index.html">← Back to portfolio</a>
    <span>
      <a class="primary" href="assets/resume.pdf" download>Download PDF</a>
      <button onclick="print()">Print</button>
    </span>
  </div>
  <main class="page" id="resume"></main>

  <script src="js/data.js"></script>
  <script>
    (function () {
      const D = window.PORTFOLIO, p = D.profile;
      const esc = (s = "") => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
      document.title = `${p.name} — Résumé`;
      const link = (label) => p.socials.find((s) => s.label === label)?.url.replace(/^https?:\/\/(www\.)?/, "") || "";

      // Most impressive projects for the résumé: featured first
      const projects = [...D.projects].sort((a, b) => b.featured - a.featured).slice(0, 4);

      document.getElementById("resume").innerHTML = `
        <header>
          <div>
            <h1>${esc(p.name)}</h1>
            <p class="role">${esc(p.role)}</p>
            <p class="tagline">AI · Distributed systems · Web · Android</p>
          </div>
          <div class="contact">
            <a href="mailto:${esc(p.email)}">${esc(p.email)}</a><br />
            ${esc(p.phone)} · ${esc(p.location.split("·")[0].trim())}<br />
            ${esc(p.website)} · ${esc(link("GitHub"))}<br />
            ${esc(link("LinkedIn"))}
          </div>
        </header>

        <h2>Summary</h2>
        <p class="summary">${esc(p.summary)}</p>

        <h2>Experience</h2>
        ${D.experience.map((e) => `
          <section class="job">
            <div class="job__head"><strong>${esc(e.role)}</strong><span>${esc(e.period)}</span></div>
            <div class="job__co">${esc(e.company)} · ${esc(e.location)}</div>
            <ul>${e.highlights.map((h) => `<li>${esc(h)}</li>`).join("")}</ul>
            <div class="stack">${e.stack.map(esc).join(" · ")}</div>
          </section>`).join("")}

        <h2>Selected projects</h2>
        ${projects.map((pr) => `
          <div class="proj"><b>${esc(pr.title)}</b> (${esc(pr.year)}): ${esc(pr.summary)}
            <span class="stack">Impact: ${pr.impact.slice(0, 3).map(esc).join("; ")}.</span>
          </div>`).join("")}

        <h2>Skills</h2>
        <div class="two skills">
          ${Object.entries(D.skills).map(([g, items]) => `<div><b>${esc(g)}:</b> ${items.map(esc).join(", ")}</div>`).join("")}
        </div>

        <h2>Education & certifications</h2>
        <div class="edu">
          ${D.education.map((e) => `<div><span><b>${esc(e.title)}</b>, ${esc(e.place)}</span><span>${esc(e.year)}</span></div>`).join("")}
        </div>`;
    })();
  </script>
</body>
</html>
